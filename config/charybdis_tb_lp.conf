# Low-power USB PMW3610 check (normal sensor downshift, ZMK sleep enabled).

CONFIG_ZMK_KEYBOARD_NAME="Charybdis LP"

CONFIG_ZMK_USB=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PINCTRL=y
CONFIG_PMW3610_ALT=y

# Let the sensor rest; no force-awake in the LP overlay.
# Default report interval (0) is fine for this check.

CONFIG_ZMK_SLEEP=y
# Idle -> sleep after 15s while on USB battery-style testing
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=15000

# Uncomment if the sensor fails product-id init (reads 0xFF):
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
