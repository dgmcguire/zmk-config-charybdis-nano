# High-power USB PMW3610 bring-up (snappy / force-awake overlay).

CONFIG_ZMK_KEYBOARD_NAME="Charybdis TB"

CONFIG_ZMK_USB=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PINCTRL=y
CONFIG_PMW3610_ALT=y

# Prefer snappy USB reports during bring-up
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8

# Uncomment if the sensor fails product-id init (reads 0xFF):
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
